version: patient_split_v1
protocol: docs/experiment_protocol_v1.md
seed: 20260929

preprocessing:
  version: fundus_512_v1
  manifest: data/processed/fundus_512_v1/preprocessing_manifest.csv

datasets:
  brset:
    role: development
    metadata_csv: data/raw/brset_v1.0.2/archive/label_brset.csv
    image_column: image_id
    patient_column: patient_id
    laterality_column: exam_eye
    laterality_mapping:
      "1": right
      "2": left
    camera_column: camera
    grade_column: DR_ICDR
    quality_column: quality
    accepted_quality: Adequate
    age_column: patient_age
    sex_column: patient_sex
    sex_mapping:
      "1": male
      "2": female
    diabetes_duration_column: diabetes_time_y
    insulin_column: insulin
    insulin_mapping:
      "yes": 1
      "no": 0
  mbrset:
    role: external_test
    metadata_csv: data/raw/mbrset_v1.0/archive/labels_mbrset.csv
    image_column: file
    patient_column: patient
    laterality_column: laterality
    laterality_mapping:
      right: right
      left: left
    camera_constant: Phelcom Eyer
    grade_column: final_icdr
    quality_column: final_quality
    accepted_quality: "yes"
    age_column: age
    age_top_code_mapping:
      ">= 90": 90
    sex_column: sex
    sex_mapping:
      "0": female
      "1": male
    diabetes_duration_column: dm_time
    insulin_column: insulin
    insulin_mapping:
      "0": 0
      "1": 1

cohort:
  required_lateralities: [left, right]
  eye_grade_aggregation: max
  patient_grade_aggregation: max
  referable_dr_min_grade: 2
  any_dr_min_grade: 1
  vision_threatening_dr_min_grade: 3
  clinical_variable_order: [age, sex, diabetes_duration, insulin]
  age_bins:
    - {name: missing, missing: true}
    - {name: "<50", min: 0, max_exclusive: 50}
    - {name: "50-64", min: 50, max_exclusive: 65}
    - {name: "65-74", min: 65, max_exclusive: 75}
    - {name: ">=75", min: 75}
  conflicting_patient_metadata_policy: set_missing

split:
  development_dataset: brset
  external_test_dataset: mbrset
  ratios:
    train: 0.70
    validation: 0.10
    internal_test: 0.20
  primary_strata: [patient_grade, camera_group]
  secondary_strata_priority:
    - sex
    - age_bin
    - metadata_mask
    - inter_eye_discordance
  secondary_weights:
    sex: 8.0
    age_bin: 4.0
    metadata_mask: 2.0
    inter_eye_discordance: 1.0
  external_split_name: external_test

expected_main_cohort:
  brset:
    patient_count: 6180
    grade_counts: {0: 5717, 1: 59, 2: 191, 3: 39, 4: 174}
    referable_dr_count: 404
  mbrset:
    patient_count: 1231
    grade_counts: {0: 845, 1: 95, 2: 195, 3: 27, 4: 69}
    referable_dr_count: 291

expected_sensitivity_cohort:
  brset:
    patient_count: 7709
    referable_dr_count: 478
  mbrset:
    patient_count: 1236
    referable_dr_count: 291

output:
  root: data/splits/patient_split_v1
  existing_policy: error
