model:
  name: b1_mask_mlp
  type: clinical_mlp
  input_mode: mask_only
  feature_count: 4
  hidden_dims: [16, 8]
  dropout: 0.10

data:
  load_images: false

training:
  epochs: 50
  batch_size: 128
  num_workers: 0

optimizer:
  learning_rate: 0.001
  weight_decay: 0.0001

evaluation:
  batch_size: 256

