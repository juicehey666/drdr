model:
  name: b1_clinical_mlp
  type: clinical_mlp
  input_mode: values_only
  feature_count: 4
  hidden_dims: [32, 16]
  dropout: 0.20

data:
  load_images: false

training:
  epochs: 50
  batch_size: 128
  num_workers: 0

optimizer:
  learning_rate: 0.001
  weight_decay: 0.0001

evaluation:
  batch_size: 256

